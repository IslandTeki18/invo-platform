name: Preview Deploy

# Vercel handles preview deploys automatically when the repo is connected
# to a Vercel project. This workflow is a placeholder for any additional
# preview-time checks or notifications.
#
# To enable Vercel preview deploys:
# 1. Connect this repo to Vercel via the Vercel dashboard
# 2. Configure each app as a separate Vercel project with root directory overrides
# 3. Vercel will auto-deploy previews on every PR

on:
  pull_request:
    branches: [main]

jobs:
  preview-ready:
    name: Preview Ready
    runs-on: ubuntu-latest
    steps:
      - run: echo "Preview deploys are managed by Vercel. CI checks run in ci.yml."
